<text x="1270" y="162" font-size="21" font-weight="800" fill="#b7791f">AWS</text>
<text x="1270" y="185" class="c2" font-size="13.5" fill="#3d4248">Bedrock + Athena or Redshift</text>
<text x="1270" y="205" class="c2" font-weight="600">Best fit: AWS shops wanting model choice</text>
<text x="40" y="264" class="h" fill="#1f6f5c">THE 7 STAGES</text>
<line x1="174" y1="260" x2="1564" y2="260" stroke="#1f6f5c" stroke-opacity="0.25"/>
<rect x="40" y="284" width="4" height="46" rx="2" fill="#1c7a52"/>
<text x="56" y="304" class="l1">1  Data</text>
<text x="56" y="322" class="l2">Get the source data in one place</text>
<rect x="280" y="280" width="312" height="52" rx="9" fill="#f1f8f5" stroke="#e6e4de"/>
