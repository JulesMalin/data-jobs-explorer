<text x="620" y="819" class="c2">App Insights, Cost Management</text>
<rect x="928" y="778" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="944" y="800" class="c1">MLflow tracing</text>
<text x="944" y="819" class="c2">system tables for usage</text>
<rect x="1252" y="778" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="1268" y="800" class="c1">AgentCore Observability</text>
<text x="1268" y="819" class="c2">CloudWatch, Cost Explorer</text>
<line x1="40" y1="856" x2="1564" y2="856" stroke="#e3e3df"/>
<text x="40" y="886" class="h" fill="#6b7177">THE SAME 5 RULES ON EVERY PLATFORM</text>
<circle cx="52" cy="918" r="12" fill="#1f6f5c"/><text x="52" y="922.5" class="badge" text-anchor="middle">1</text>
<text x="74" y="916" class="r">Describe every table,</text><text x="74" y="935" class="r">including its caveats</text>
<circle cx="358" cy="918" r="12" fill="#1f6f5c"/><text x="358" y="922.5" class="badge" text-anchor="middle">2</text>
<text x="380" y="916" class="r">Give the model a few</text><text x="380" y="935" class="r">read-only tools</text>
<circle cx="664" cy="918" r="12" fill="#1f6f5c"/><text x="664" y="922.5" class="badge" text-anchor="middle">3</text>
<text x="686" y="916" class="r">Let the database decide</text><text x="686" y="935" class="r">who sees which rows</text>
<circle cx="970" cy="918" r="12" fill="#1f6f5c"/><text x="970" y="922.5" class="badge" text-anchor="middle">4</text>
<text x="992" y="916" class="r">Cap the loop and</text><text x="992" y="935" class="r">show every query</text>
<circle cx="1276" cy="918" r="12" fill="#1f6f5c"/><text x="1276" y="922.5" class="badge" text-anchor="middle">5</text>
<text x="1298" y="916" class="r">Rerun a benchmark set</text><text x="1298" y="935" class="r">when anything changes</text>
<text x="40" y="978" class="f">Product names as of October 2026. Vendors rename agent products often, so check current docs. Full table and code: github.com/JulesMalin/data-jobs-explorer</text>
