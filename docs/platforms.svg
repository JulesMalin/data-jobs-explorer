<rect width="1600" height="1001" fill="#fbfaf7"/>
<text x="40" y="58" class="t">7 AI pipeline stages, 4 ways to build them: this demo, Microsoft, Databricks, AWS</text>
<text x="40" y="90" class="st">Each row is one stage of the pipeline. Read across to see which product does that job on each platform.</text>
<g filter="url(#sh)"><rect x="280" y="124" width="312" height="96" rx="12" fill="#fff" stroke="#e3e1db"/></g>
<path d="M292,124 H580 A12,12 0 0 1 592,136 V130 H280 V136 A12,12 0 0 1 292,124 z" fill="#1f6f5c"/>
<text x="298" y="162" font-size="21" font-weight="800" fill="#1f6f5c">This demo</text>
<text x="298" y="185" class="c2" font-size="13.5" fill="#3d4248">Plain JavaScript in a web page</text>
<text x="298" y="205" class="c2" font-weight="600">Best fit: learning and prototypes, $0</text>
<g filter="url(#sh)"><rect x="604" y="124" width="312" height="96" rx="12" fill="#fff" stroke="#e3e1db"/></g>
