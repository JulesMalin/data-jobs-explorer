<text x="620" y="360" class="c1">Power BI semantic model</text>
<text x="620" y="379" class="c2">Document Intelligence</text>
<rect x="928" y="338" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="944" y="360" class="c1">Unity Catalog metric views</text>
<text x="944" y="379" class="c2">Lakeflow pipelines</text>
<rect x="1252" y="338" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
