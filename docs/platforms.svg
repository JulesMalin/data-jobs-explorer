<text x="944" y="761" class="c2">row filters, column masks</text>
<rect x="1252" y="720" width="312" height="52" rx="9" fill="#fffaf0" stroke="#d9a556" stroke-width="1.5"/>
<text x="1268" y="742" class="c1">IAM + Lake Formation</text>
<text x="1268" y="761" class="c2">Bedrock Guardrails</text>
<rect x="40" y="782" width="4" height="46" rx="2" fill="#3d4f61"/>
