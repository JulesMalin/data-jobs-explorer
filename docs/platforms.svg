<rect x="1252" y="570" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="1268" y="592" class="c1">Bedrock evaluations</text>
<text x="1268" y="611" class="c2">AgentCore evaluations</text>
<rect x="40" y="632" width="4" height="46" rx="2" fill="#1c7a52"/>
<text x="56" y="652" class="l1">7  Serve</text>
<text x="56" y="670" class="l2">Where people work, with limits</text>
<rect x="280" y="628" width="312" height="52" rx="9" fill="#f1f8f5" stroke="#e6e4de"/>
<text x="296" y="650" class="c1">A static web page</text>
<text x="296" y="669" class="c2">15 questions an hour, approval</text>
<rect x="604" y="628" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="620" y="650" class="c1">Teams, Copilot Studio</text>
<text x="620" y="669" class="c2">API Management AI gateway</text>
<rect x="928" y="628" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="944" y="650" class="c1">Databricks One, Apps</text>
<text x="944" y="669" class="c2">Slack, Teams</text>
<rect x="1252" y="628" width="312" height="52" rx="9" fill="#ffffff" stroke="#e6e4de"/>
<text x="1268" y="650" class="c1">Quick Suite or a custom app</text>
<text x="1268" y="669" class="c2">CloudFront with Cognito</text>
<text x="40" y="704" class="h" fill="#b23a2f">UNDER EVERY STAGE</text>
<line x1="224" y1="700" x2="1564" y2="700" stroke="#b23a2f" stroke-opacity="0.25"/>
<rect x="40" y="724" width="4" height="46" rx="2" fill="#b23a2f"/>
<text x="56" y="744" class="l1">Secure and govern</text>
<text x="56" y="762" class="l2" fill="#b26f12" font-weight="700">Biggest change from the demo</text>
<rect x="280" y="720" width="312" height="52" rx="9" fill="#fffaf0" stroke="#d9a556" stroke-width="1.5"/>
<text x="296" y="742" class="c1">Read-only SQL, no file reads</text>
<text x="296" y="761" class="c2">prompt shield, key stays in tab</text>
<rect x="604" y="720" width="312" height="52" rx="9" fill="#fffaf0" stroke="#d9a556" stroke-width="1.5"/>
