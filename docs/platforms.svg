<text x="946" y="185" class="c2" font-size="13.5" fill="#3d4248">Unity Catalog + Mosaic AI</text>
<text x="946" y="205" class="c2" font-weight="600">Best fit: data and ML on Databricks</text>
<g filter="url(#sh)"><rect x="1252" y="124" width="312" height="96" rx="12" fill="#fff" stroke="#e3e1db"/></g>
