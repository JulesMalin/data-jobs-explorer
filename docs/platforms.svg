<text x="622" y="162" font-size="21" font-weight="800" fill="#2b6cb0">Microsoft</text>
<text x="622" y="185" class="c2" font-size="13.5" fill="#3d4248">Fabric + Azure AI Foundry</text>
<text x="622" y="205" class="c2" font-weight="600">Best fit: Microsoft 365 and Power BI</text>
<g filter="url(#sh)"><rect x="928" y="124" width="312" height="96" rx="12" fill="#fff" stroke="#e3e1db"/></g>
